name: Unit Tests

on:
  push:
    branches: master
  pull_request:
    branches: master

jobs:
  formatJob:
    name: Run UnitTests
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install pep8 python3-autopep8 python3-pep8 python-is-python3
        sudo apt-get install python3-pip pep8 python3-autopep8 python3-pep8 python-is-python3 libgeos-dev
        sudo pip3 install pylint --upgrade
        sudo pip3 install -r requirements.txt

    - name: Run Unit Tests
      # One process per module: several suites replace modules in sys.modules.
      run: |
        export PYTHONPATH=$PYTHONPATH:`pwd`:`pwd`/srunner/tests/carla_mocks
        python3 -m unittest srunner/tests/test_xosc_load.py
        for test in srunner/tests/test_openscenario_*.py; do
          python3 -m unittest "$test"
        done
        python3 -m unittest tests/test_carla_compat.py
        python3 -m unittest tests/test_recorder_chaos.py
